# Nginx da plataforma em HTTPS: certificado em /etc/nginx/certs (server.crt + server.key).
# Gerado por infra/scripts/https.sh. A porta 80 só redireciona para o HTTPS, serve o
# certificado da AC interna (para instalar nas estações) e responde ao healthcheck.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream plataforma_api {
  server api:3000;
  keepalive 32;
}

server {
  listen 80 default_server;
  server_name _;
  server_tokens off;

  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
  }

  # Certificado público da AC interna (não é segredo): para a TI baixar e distribuir.
  location = /certificado-ac.crt {
    alias /etc/nginx/certs/ca.crt;
    types { }
    default_type application/x-x509-ca-cert;
  }

  location / {
    # __HTTPS_PORT_SUFFIX__ vira ":8443" quando o HTTPS não está na porta 443.
    return 301 https://$host__HTTPS_PORT_SUFFIX__$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name _;
  server_tokens off;

  ssl_certificate /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:plataforma_tls:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # 180 dias, como a API. Só é enviado em HTTPS.
  set $plataforma_hsts "max-age=15552000";

  location = /certificado-ac.crt {
    alias /etc/nginx/certs/ca.crt;
    types { }
    default_type application/x-x509-ca-cert;
  }

  include /etc/nginx/plataforma/app.conf;
}
