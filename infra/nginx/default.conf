# Nginx da plataforma: serve a interface (SPA) e encaminha /api e /socket.io à API.
# HTTP nesta fase (decisão da organização). Para ativar HTTPS, ver docs/implantacao.md.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream plataforma_api {
  server api:3000;
  keepalive 32;
}

server {
  listen 80 default_server;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;

  # Anexos de até 50 MB (fase 1) + margem do envelope multipart.
  client_max_body_size 55m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Cabeçalhos de segurança da interface. A API define os seus próprios.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://plataforma_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # $http_host preserva a porta digitada no navegador (usada na verificação de origem).
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
    proxy_request_buffering off;
  }

  # Tempo real (fase 1): conexões WebSocket de longa duração.
  location /socket.io/ {
    proxy_pass http://plataforma_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # $http_host preserva a porta digitada no navegador (usada na verificação de origem).
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # Arquivos com hash no nome: cache longo e imutável.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Rotas da SPA: sempre devolvem o index.html, que nunca é guardado em cache.
  location / {
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
