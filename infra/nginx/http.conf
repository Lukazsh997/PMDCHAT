# Nginx da plataforma em HTTP (sem certificado em /etc/nginx/certs).
# Para ligar o HTTPS: infra/scripts/https.sh (ver docs/implantacao.md).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream plataforma_api {
  server api:3000;
  keepalive 32;
}

server {
  listen 80 default_server;
  server_name _;
  server_tokens off;
  set $plataforma_hsts "";

  include /etc/nginx/plataforma/app.conf;
}
