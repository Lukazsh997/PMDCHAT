# Plataforma de Comunicação Interna — implantação em uma VM Linux.
# Uso: cp .env.example .env  (ajuste)  →  docker compose up -d --build
# Somente o Nginx publica porta; banco, Valkey e API ficam na rede interna.

name: plataforma

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-api-env: &api-env
  NODE_ENV: production
  APP_VERSION: ${APP_VERSION:-0.1.0}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://valkey:6379/0
  APP_ORIGINS: ${APP_ORIGINS}
  TRUST_PROXY_HOPS: '1'
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-480}
  SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-72}
  LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
  LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
  LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
  API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-600}
  BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=500
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 2g
    logging: *logging

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # noeviction: exigido pelas filas (BullMQ); sessões e limites usam TTL próprio.
    command:
      [
        'valkey-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 384m
    logging: *logging

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: api
    image: plataforma/api:${APP_VERSION:-0.1.0}
    restart: unless-stopped
    command: ['api']
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    mem_limit: 768m
    logging: *logging

  worker:
    image: plataforma/api:${APP_VERSION:-0.1.0}
    # Mesma imagem da API, construída pelo serviço "api": nunca buscar no Docker Hub.
    pull_policy: never
    restart: unless-stopped
    command: ['worker']
    environment: *api-env
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      # O worker renova este arquivo a cada 20 s enquanto está funcionando.
      test:
        - CMD
        - node
        - -e
        - "process.exit(Date.now() - require('fs').statSync('/tmp/worker-heartbeat').mtimeMs < 60000 ? 0 : 1)"
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    mem_limit: 512m
    logging: *logging

  nginx:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: web
      args:
        VITE_ORG_NAME: ${ORG_NAME:-Comunicação Interna}
    image: plataforma/web:${APP_VERSION:-0.1.0}
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 128m
    logging: *logging

volumes:
  pgdata:
  valkeydata:
