name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: plataforma
          POSTGRES_PASSWORD: plataforma
          POSTGRES_DB: plataforma_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U plataforma" --health-interval 5s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://plataforma:plataforma@localhost:5432/plataforma_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v5
      - name: Subir a plataforma completa (como na VM, com antivírus)
        run: |
          cp .env.example .env
          sed -i 's|^APP_ORIGINS=.*|APP_ORIGINS=http://localhost|' .env
          docker compose up -d --build --wait --wait-timeout 600
      - name: Login, troca de senha e anexos pelo Nginx
        run: |
          set -e
          H='content-type: application/json'
          O='origin: http://localhost'
          curl -fsS http://localhost/api/v1/health
          curl -fsS http://localhost/ | grep -q '<div id="root">'
          curl -fsS -c jar -H "$H" -H "$O" -d '{"username":"admin","password":"TroqueNoPrimeiroAcesso2026"}' \
            http://localhost/api/v1/auth/login > /dev/null
          curl -fsS -b jar -c jar -H "$H" -H "$O" -o /dev/null -w '%{http_code}\n' \
            -d '{"currentPassword":"TroqueNoPrimeiroAcesso2026","newPassword":"NovaSenhaDoCI2026"}' \
            http://localhost/api/v1/auth/password
          echo 'documento comum' > comum.txt
          code=$(curl -s -b jar -H "$O" -o /dev/null -w '%{http_code}' -F file=@comum.txt http://localhost/api/v1/files)
          echo "upload comum: $code"; test "$code" = 201
          printf '%s' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > eicar.txt
          code=$(curl -s -b jar -H "$O" -o resp.json -w '%{http_code}' -F file=@eicar.txt http://localhost/api/v1/files)
          echo "upload EICAR: $code $(cat resp.json)"; test "$code" = 422
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --tail 100
